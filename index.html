<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lötfrei Elektronik-Labor</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div class="brand"><svg viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="6" fill="#f2b705"/><path d="M4 13h4l2-5 3 10 3-10 2 5h4" fill="none" stroke="#1b2730" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/></svg>Lötfrei</div>
  <span class="muted">Elektronik und ESP32 an der Werkbank lernen</span>
  <span class="sp"></span>
  <div class="tb">
    <button type="button" class="btn" id="undoBtn">Rückgängig <kbd>Strg Z</kbd></button>
    <button type="button" class="btn" id="resetBtn"><span class="long">Lektion zurücksetzen</span><span class="short">Zurücksetzen</span></button>
    <button type="button" class="btn" id="muteBtn" aria-pressed="true"><span>Ton an</span></button>
  </div>
</header>
<main>
  <nav aria-label="Lektionen"><div id="nav"></div><div class="prog"><span id="progress"></span><div><i id="bar"></i></div></div></nav>
  <div class="center">
    <div class="benchwrap">
      <svg id="bench" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet" role="application" aria-label="Werkbank">
        <defs>
          <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="0" cy="0" r="1.1" fill="#fff" opacity=".2"/><circle cx="20" cy="0" r="1.1" fill="#fff" opacity=".2"/><circle cx="0" cy="20" r="1.1" fill="#fff" opacity=".2"/><circle cx="20" cy="20" r="1.1" fill="#fff" opacity=".2"/></pattern>
          <pattern id="grid5" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M100 0H0V100" fill="none" stroke="#fff" stroke-opacity=".09"/></pattern>
          <radialGradient id="glow-rot"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".25" stop-color="#ff4a3d" stop-opacity=".85"/><stop offset="1" stop-color="#ff4a3d" stop-opacity="0"/></radialGradient>
          <radialGradient id="glow-gelb"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".25" stop-color="#ffc531" stop-opacity=".85"/><stop offset="1" stop-color="#ffc531" stop-opacity="0"/></radialGradient>
          <radialGradient id="glow-gruen"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".25" stop-color="#3ee06a" stop-opacity=".85"/><stop offset="1" stop-color="#3ee06a" stop-opacity="0"/></radialGradient>
          <radialGradient id="glow-blau"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".25" stop-color="#4a8dff" stop-opacity=".85"/><stop offset="1" stop-color="#4a8dff" stop-opacity="0"/></radialGradient>
        </defs>
        <rect class="matr" width="1000" height="620" rx="10" style="fill:var(--mat)"/><rect class="matr" width="1000" height="620" fill="url(#grid)"/><rect class="matr" width="1000" height="620" fill="url(#grid5)"/>
        <g id="gComps"></g><g id="gWires"></g>
        <path id="ghostWire" style="display:none"/><circle id="termHi" r="11" style="display:none"/>
        <g id="gFx"></g>
      </svg>
      <div id="status">Simulation läuft</div>
      <button type="button" id="goalChip" hidden></button>
      <div class="zoom"><button type="button" id="zIn" aria-label="Vergrößern">+</button><button type="button" id="zOut" aria-label="Verkleinern">−</button><button type="button" id="zFit" aria-label="Ganze Werkbank zeigen"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg></button></div>
      <div id="toast" role="status"></div>
    </div>
    <div class="traywrap"><h2>Baukasten</h2><div id="tray"></div><span id="trayEmpty" class="muted" hidden>Für diese Lektion liegt alles auf der Werkbank.</span></div>
  </div>
  <aside>
    <section id="lesson">
      <h1 id="lTitle"></h1><div id="lText"></div>
      <div id="goalSec"><ul id="goals"></ul></div>
      <div id="hints"></div>
      <button type="button" class="btn" id="hintBtn">Tipp zeigen</button>
      <div id="win" hidden><b>Geschafft</b><button type="button" class="btn" id="nextBtn">Nächste Lektion</button></div>
    </section>
    <section id="inspector"></section>
    <section id="codeSec" hidden>
      <div class="codehead"><h3>Sketch auf dem ESP32</h3><select id="skSel" aria-label="Sketch auswählen"></select></div>
      <pre id="code"></pre>
      <table class="pins"><tbody id="pins"></tbody></table>
      <pre id="serial" aria-label="Serieller Monitor"></pre>
    </section>
  </aside>
</main>
<script src="js/sim.js"></script>
<script src="js/app.js"></script>
</body>
</html>
