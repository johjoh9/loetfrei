<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lötfrei Elektronik-Labor</title>
<meta name="description" content="Elektronik-Labor im Browser: Schaltungen bauen, Elektrotechnik und ESP32 lernen.">
<meta name="theme-color" content="#fffdf8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#192c30" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div class="brand"><svg viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="6" fill="#f2b705"/><path d="M4 13h4l2-5 3 10 3-10 2 5h4" fill="none" stroke="#1b2730" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/></svg>Lötfrei</div>
  <span class="muted" data-i="sub">Elektronik und ESP32 an der Werkbank lernen</span>
  <span class="sp"></span>
  <div class="tb">
    <button type="button" class="btn" id="undoBtn" data-ia="undo"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3L2.5 6.5 6 10M3 6.5h6.5a4 4 0 0 1 0 8H7"/></svg><span data-i="undo">Rückgängig</span> <kbd data-i="kbdUndo">Strg Z</kbd></button>
    <button type="button" class="btn" id="resetBtn" data-ia="reset"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2v3.2h-3.2"/></svg><span data-i="reset">Lektion zurücksetzen</span></button>
    <button type="button" class="btn" id="muteBtn" aria-pressed="true"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 6v4H5l3.5 3V3L5 6z"/></svg><span>Ton an</span></button>
    <div class="lang" role="group" data-ia="aLang"><button type="button" data-lang="de" aria-pressed="true">DE</button><button type="button" data-lang="en" aria-pressed="false">EN</button></div>
  </div>
</header>
<main>
  <nav aria-label="Lektionen" data-ia="aNav"><div id="nav"></div><div class="prog"><span id="progress"></span><div><i id="bar"></i></div></div></nav>
  <div class="center">
    <div class="benchwrap">
      <svg id="bench" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet" role="application" aria-label="Werkbank" data-ia="aBench">
        <defs>
          <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="0" cy="0" r="1.1" fill="#fff" opacity=".2"/><circle cx="20" cy="0" r="1.1" fill="#fff" opacity=".2"/><circle cx="0" cy="20" r="1.1" fill="#fff" opacity=".2"/><circle cx="20" cy="20" r="1.1" fill="#fff" opacity=".2"/></pattern>
          <pattern id="grid5" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M100 0H0V100" fill="none" stroke="#fff" stroke-opacity=".09"/></pattern>
          <radialGradient id="glow-rot"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".25" stop-color="#ff4a3d" stop-opacity=".85"/><stop offset="1" stop-color="#ff4a3d" stop-opacity="0"/></radialGradient>
          <radialGradient id="glow-gelb"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".25" stop-color="#ffc531" stop-opacity=".85"/><stop offset="1" stop-color="#ffc531" stop-opacity="0"/></radialGradient>
          <radialGradient id="glow-gruen"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".25" stop-color="#3ee06a" stop-opacity=".85"/><stop offset="1" stop-color="#3ee06a" stop-opacity="0"/></radialGradient>
          <radialGradient id="glow-blau"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".25" stop-color="#4a8dff" stop-opacity=".85"/><stop offset="1" stop-color="#4a8dff" stop-opacity="0"/></radialGradient>
        </defs>
        <rect class="matr" width="1000" height="620" rx="10" style="fill:var(--mat)"/><rect class="matr" width="1000" height="620" fill="url(#grid)"/><rect class="matr" width="1000" height="620" fill="url(#grid5)"/>
        <g id="gComps"></g><g id="gWires"></g>
        <path id="ghostWire" style="display:none"/><circle id="termHi" r="11" style="display:none"/>
        <g id="gFx"></g>
      </svg>
      <div id="status">Simulation läuft</div>
      <button type="button" id="goalChip" hidden></button>
      <div class="zoom"><button type="button" id="zIn" data-ia="aIn">+</button><button type="button" id="zOut" data-ia="aOut">−</button><button type="button" id="zFit" data-ia="aFit"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg></button></div>
      <div id="toast" role="status"></div>
    </div>
    <div class="traywrap"><h2 data-i="tray">Baukasten</h2><div id="tray"></div><span id="trayEmpty" class="muted" data-i="trayEmpty" hidden>Für diese Lektion liegt alles auf der Werkbank.</span></div>
  </div>
  <aside>
    <section id="lesson">
      <div class="lhead"><h1 id="lTitle"></h1><button type="button" id="foldBtn" class="fold" aria-expanded="true" aria-controls="lBody" data-ia="aFold"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 6l4.5 4.5L12.5 6"/></svg></button></div>
      <div class="learning-actions">
        <button type="button" class="btn primary" id="schematicBtn" aria-haspopup="dialog" aria-controls="schematicDialog">Schaltplan</button>
      </div>
      <div id="lBody">
      <div id="lText"></div>
      <details id="solution" class="learning-solution">
        <summary id="solutionLabel">Lösungsweg anzeigen</summary>
        <p class="muted" id="solutionNote"></p>
        <ol id="solutionSteps"></ol>
      </details>
      <div id="goalSec"><ul id="goals"></ul></div>
      <div id="hints"></div>
      <button type="button" class="btn" id="hintBtn">Tipp zeigen</button>
      <div id="win" hidden><b data-i="done">Geschafft</b><button type="button" class="btn" id="nextBtn">Nächste Lektion</button></div>
      </div>
    </section>
    <section id="inspector"></section>
    <section id="codeSec" hidden>
      <div class="codehead"><h3 data-i="sketch">Sketch auf dem ESP32</h3><select id="skSel" data-ia="aSk"></select></div>
      <pre id="code"></pre>
      <table class="pins"><tbody id="pins"></tbody></table>
      <pre id="serial" data-ia="aSerial"></pre>
    </section>
  </aside>
</main>
<dialog id="schematicDialog" aria-labelledby="schematicTitle" aria-describedby="schematicNote">
  <div class="dialog-head"><h2 id="schematicTitle"></h2><button type="button" class="btn" id="closeSchematic">Schließen</button></div>
  <p id="schematicNote" class="muted"></p>
  <div id="schematicImage" tabindex="0"></div>
  <p id="schematicLegend" class="muted"></p>
</dialog>
<script src="js/learning.js"></script>
<script src="js/sim.js"></script>
<script src="js/app.js"></script>
</body>
</html>
